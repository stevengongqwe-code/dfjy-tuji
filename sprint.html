<header><div style="max-width:720px;margin:auto"><a href="./">← 返回完整突击包</a><h1>⚡ 考前极速冲刺</h1><p>第二章 · 临床检疫 + 病理检疫｜18条高价值考点｜零测验、点击即看</p></div></header>

<div class="lead"><b>怎么用：</b>先快速浏览所有题目，遇到不会的再点开展开答案。每张卡有一句口诀与PPT定位，优先拿关键词分。<div class="links"><a href="chapter3.html" style="font-weight:700">🔥第三章大题优先背</a><a href="./#essays">8道论述题</a><a href="./#calc">计算题</a><a href="./#quick">综合速查</a></div></div>

<div class="count" id="count"></div><main id="cards"></main>
<div class="foot">依据本次复习使用的《第2章—临床检疫技术》《第2章—病理检疫技术》课件整理；为考前辅助材料，不代表正式试卷范围，也不能用单一病变代替确诊。页面为纯静态内容，不收集答案或个人信息。</div>

<script>
(function(){'use strict';const items=[["临床","什么是临床检疫？","在流行病学调查基础上，运用临床诊断技术，对动物进行检疫检查。\n目的：了解疫情、判断健康状态、圈定疑似疫病范围，为进一步检查提供依据。","调查—判断—圈定","临床PPT 第5–6页"],["临床","临床检疫分哪两类？","群体检查：检查整群健康状况，发现、隔离异常动物。\n个体检查：对患病或疑似患病动物进行详细检查。","先群体，后个体","临床PPT 第7页"],["临床","群体检查的三方面是什么？","静态检查：精神、姿势、呼吸、反刍等。\n动态检查：步态、跛行、行动困难等。\n饮食及排泄检查：采食饮水、吞咽、腹泻、尿色等。","静—动—食排","临床PPT 第8–9页"],["临床","个体检查有哪些方法？","视诊：精神外貌、皮肤黏膜、排泄。\n听诊：叫声、肺呼吸音、心音、胃肠音。\n触诊：皮温、皮肤、体表淋巴结。\n三数：体温、脉搏、呼吸数。","视—听—触—三数","临床PPT 第10–18页"],["临床","“三数”包括什么？","体温、脉搏、呼吸数。\n课件：家畜体温常测直肠；家禽测泄殖腔或翼下温度。马脉搏可查颌外动脉，牛可查尾中动脉。","温—脉—呼","临床PPT 第17–19页"],["临床","常见动物正常体温？","猪：38.0～39.5℃；牛：37.5～39.5℃；羊：38.5～40.0℃；马：37.5～38.5℃；鸡：40.0～42.5℃。\n注意：剧烈运动、暴晒、长途运输等也可能使体温升高。","先记猪、羊、鸡","临床PPT 第17、19页"],["临床","检查黏膜与淋巴结时看什么？","可视黏膜：有无苍白、潮红、黄染、发绀、出血或溃疡。\n体表淋巴结：大小、形状、硬度、敏感性、活动性；牛关注下颌、颈浅、髂下、乳房淋巴结。","黏膜看颜色，淋巴看五项","临床PPT 第12、15页"],["病理","解剖检疫的定义与原则？","利用病理解剖知识剖检动物尸体，观察病理变化。\n原则：先体表、被毛、黏膜、天然孔；再看器官和组织；严格消毒、隔离；疑似炭疽等特定烈性传染病尸体严禁常规解剖。","先外后内；消毒隔离；特殊禁剖","病理PPT：解剖检疫技术"],["病理","淋巴结水肿、浆液性炎、出血性炎怎么区别？","水肿：肿大，切面苍白、松软、有液体。\n浆液性炎：肿大柔软，挤压有浆液性渗出。\n出血性炎：深红或黑红，切面可呈大理石样花纹；课件以猪瘟举例。","水肿白软；浆液多液；出血红黑","病理PPT：常见淋巴结病变"],["病理","化脓性、急性增生性、慢性增生性淋巴结炎怎么区别？","化脓性：黄白色脓灶或脓肿。\n急性增生性：松软、多汁，可呈髓样变。\n慢性增生性：质地坚实、结缔组织增生；特异性慢性炎可见干酪样坏死、钙化（如结核）。","脓=黄白；急=软；慢=硬；结核=干酪钙化","病理PPT：常见淋巴结病变"],["病理","哪些典型病变常用于识别？","绒毛心：纤维素性心包炎。\n虎斑心：心肌出现斑纹样病变。\n肠纽扣状溃疡：课件与猪瘟相联系。\n白肌病：与硒和／或维生素E缺乏有关。\n这些提示疾病方向，不能仅据单一病变确诊。","绒毛心—心包；虎斑心—心肌；纽扣肠—猪瘟","病理PPT：组织和器官病变"],["病理","大叶性肺炎有哪四个病变时期？","充血水肿期 → 红色肝变期 → 灰色肝变期 → 消散期。","充—红—灰—散","病理PPT：组织和器官病变"],["病理","石蜡切片的完整十步骤？","取材 → 固定 → 脱水 → 透明 → 透蜡 → 包埋 → 切片 → 贴片 → 染色 → 封片。","取固脱透蜡包切贴染封","病理PPT：石蜡切片技术"],["病理","石蜡切片关键试剂与数字？","固定：课件列4%中性福尔马林。\n脱水：梯度乙醇；透明：二甲苯；透蜡：熔融石蜡。\n常规切片厚度：3～5 μm；HE染色用苏木精、伊红。","固定—乙醇—二甲苯—石蜡","病理PPT：石蜡切片技术"],["病理","石蜡切片和冰冻切片的优缺点？","石蜡：制片慢，组织形态通常清晰，便于长期保存；处理过程可能影响部分脂类和抗原。\n冰冻：快速，较好保留脂类、抗原和部分酶活性；但可能出现冰晶伪影，形态质量往往较差。\n课件厚度：石蜡3～5 μm，冰冻约4～10 μm。","石蜡慢而精；冰冻快但有冰晶","病理PPT：两种切片比较"],["病理","什么是免疫组织化学（IHC）？","用标记抗体与组织中的特异性抗原结合，对靶抗原进行定位检测。\n免疫酶组化常用HRP与DAB产生棕褐色沉淀；免疫荧光用荧光标记并在荧光显微镜下观察。","抗体找抗原；HRP+DAB显棕色","病理PPT：免疫组织化学技术"],["病理","免疫组化直接法与间接法有何区别？","直接法：标记在一抗上，一抗直接结合目标抗原，步骤少但通常没有信号放大。\n间接法：一抗结合抗原，标记二抗再结合一抗，可增强信号。","直接一抗；间接二抗","病理PPT：免疫组化分类"],["病理","免疫组化SP法与ABC法有什么区别？","两者都利用生物素-亲和素体系配合酶显色。\nSP：链霉亲和素-过氧化物酶；ABC：亲和素-生物素-过氧化物酶复合物。\n课件强调SP通常背景较低、试剂较稳定，ABC复合物需预先配制。","SP链霉亲和素；ABC亲和素复合物","病理PPT：免疫组化分类"]];const main=document.getElementById('cards'),search=document.getElementById('search'),count=document.getElementById('count');let kind='全部';
function make(tag,cl,txt){const n=document.createElement(tag);if(cl)n.className=cl;if(txt!==undefined)n.textContent=txt;return n}
items.forEach((d)=>{const detail=make('details','topic');detail.dataset.kind=d[0];detail.dataset.text=d.join(' ').toLowerCase();const sum=make('summary');sum.append(make('span','tag',d[0]),make('span','',d[1]));detail.append(sum);const body=make('div','answer',d[2]);body.append(make('div','memo','速记：'+d[3]),make('div','source','来源：'+d[4]));detail.append(body);main.append(detail)});
function filter(){const word=search.value.trim().toLowerCase();let n=0;document.querySelectorAll('.topic').forEach(el=>{let hit=(kind==='全部'||el.dataset.kind===kind)&&el.dataset.text.includes(word);el.hidden=!hit;if(hit)n++});count.textContent='显示 '+n+' / '+items.length+' 个考点'}
search.addEventListener('input',filter);document.querySelectorAll('button[data-kind]').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('button[data-kind]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));filter()}));
document.getElementById('expand').addEventListener('click',()=>document.querySelectorAll('.topic:not([hidden])').forEach(x=>x.open=true));document.getElementById('collapse').addEventListener('click',()=>document.querySelectorAll('.topic').forEach(x=>x.open=false));filter();
})();
</script></body></html>

  h+='<div class="qz"><div class="q">'+q.q+'</div>';
  q.o.forEach(function(o,k){

  });
  h+='<div id="fb"></div><button class="next" id="nx" disabled onclick="nextQ()">'+(qi===QUIZ.length-1?'看结果':'下一题')+'</button></div>';
  m.innerHTML=h;
  qanswered=false;
  document.getElementById('fb').innerHTML='';
}

function pick(k){
  if(qanswered) return;
  qanswered=true;
  var q=QUIZ[qi];
  var opts=document.querySelectorAll('.opt');
  opts.forEach(function(b,i){
    if(i===q.a) b.classList.add('right');
    else if(i===k) b.classList.add('wrong');
  });
  if(k===q.a) qscore++;
  document.getElementById('fb').innerHTML='<div class="fb"><b>'+(k===q.a?'✓ 答对了':'✗ 答错了，正确答案是 '+"ABCD"[q.a])+'</b><br>'+q.t+'</div>';
  document.getElementById('nx').disabled=false;
}

function nextQ(){qi++;renderQuiz();}
function restartQuiz(){qi=0;qscore=0;renderQuiz();}

/* ========== 交互 ========== */
function toggleNoun(i){
  openNouns[i]=!openNouns[i];
  render();
}
function toggleShort(i){
  openShort[i]=!openShort[i];
  render();
}
function markM(i,btn){
  var p=mastered.indexOf(i);
  if(p>=0){mastered.splice(p,1);btn.classList.remove('on');btn.textContent='标记掌握了';}
  else{mastered.push(i);btn.classList.add('on');btn.textContent='✓ 已掌握';}
  saveM();
  var mc=document.getElementById('mc');
  if(mc) mc.textContent=mastered.length;
}

document.getElementById('nav').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  TAB=b.dataset.t;
  [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
  render();
});

document.getElementById('shareBtn').addEventListener('click',function(){
  var u=location.href;
  if(u.indexOf('file:')===0){alert('这是本地文件，先部署到网上再分享');return;}
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(u).then(function(){alert('链接已复制，粘贴到微信发给同学');},function(){prompt('手动复制链接：',u);});
  }else{
    var t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();
    try{document.execCommand('copy');alert('链接已复制');}catch(err){prompt('手动复制链接：',u);}
    document.body.removeChild(t);
  }
});

render();
</script>
</body>
